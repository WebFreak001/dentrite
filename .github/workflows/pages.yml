# Publishes the guide (Jekyll, as GitHub renders Markdown) at the site root and the API reference under /api/.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-latest
      - uses: actions/configure-pages@v5
      - name: API reference
        run: rdmd tools/apidoc.d
      - uses: actions/jekyll-build-pages@v1
        with:
          source: guide
          destination: _site
      # NOTE: jekyll-build-pages leaves _site owned by root
      - name: Merge
        run: sudo cp -r bin/apidoc _site/api
      - uses: actions/upload-pages-artifact@v4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
